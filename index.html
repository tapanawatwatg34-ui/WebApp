<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💰 เครื่องคำนวณเงินออมประจำเดือน</h2>
        
        <div class="form-group">
            <label for="income">รายได้ต่อเดือน (บาท):</label>
            <input type="number" id="income" placeholder="เช่น 15000">
        </div>

        <div class="form-group">
            <label for="goal">เป้าหมายเงินออม (บาท):</label>
            <input type="number" id="goal" placeholder="เช่น 3000">
        </div>

        <div class="form-group">
            <label for="period">ระยะเวลาที่ต้องการออม (เดือน):</label>
            <select id="period">
                <option value="1">1 เดือน</option>
                <option value="3">3 เดือน</option>
                <option value="6">6 เดือน</option>
                <option value="12">12 เดือน</option>
            </select>
        </div>

        <div class="btn-group">
            <button id="btn-calc" class="btn btn-primary">🧮 คำนวณผล</button>
            <button id="btn-save" class="btn btn-success">💾 บันทึกข้อมูล</button>
            <button id="btn-clear" class="btn btn-danger">🗑️ ล้างข้อมูลเก่า</button>
        </div>

        <div id="result-box" class="result-box hidden">
            <h3>📊 ผลการวิเคราะห์</h3>
            <p>คุณต้องออมเงินเดือนละ: <strong id="save-per-month">0</strong> บาท</p>
            <p>คิดเป็น: <strong id="save-percentage">0</strong>% ของรายได้</p>
            <div id="status-badge" class="badge">รอการคำนวณ</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
